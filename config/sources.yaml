  separator: ";"
  encoding: "utf-8-sig"

anp_producao_etanol:
  name: "ANP — Produção de etanol anidro e hidratado por UF"
  adapter: anp
  url: "https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/arquivos/arquivos-producao-de-biocombustiveis/producao-etanol-anidro-hidratado-m3-2012-2026.csv"
  separator: ";"
  encoding: "utf-8-sig"
