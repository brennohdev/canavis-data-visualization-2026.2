  table: "1612"
  product_classifier: "c81"
  product_code: "2696"
  variables:
    area_plantada: "109"
    area_colhida: "216"
    quantidade_produzida: "214"
    rendimento_medio: "112"
    valor_producao: "215"
  extractions:
