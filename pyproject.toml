[project]
name = "canavis"
version = "0.1.0"
description = "Benchmarking regional da produção de cana-de-açúcar na Paraíba — camada de dados e futura aplicação."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "pyyaml>=6.0.2",
    "openpyxl>=3.1.5",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
]
# API da Etapa 3 (FastAPI + DuckDB). Fica fora de `dependencies` para não
# contaminar o núcleo do pipeline (ADR 0003, ADR 0018).
api = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "duckdb==2.0.1",
]
dev = ["pytest>=8.3.0", "ruff==0.17.6", "httpx==0.29.0"]

[project.scripts]
canavis-pipeline = "canavis.pipeline.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canavis", "apps/api/src/canavis_api"]

[tool.pytest.ini_options]
pythonpath = ["src", "apps/api/src"]
testpaths = ["tests", "apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "apps/api/src"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Regras mínimas (erros de sintaxe e pyflakes): não reescreve o código legado do pipeline.
select = ["E9", "F"]
