[project]
name = "canavis"
version = "0.1.0"
description = "Benchmarking regional da produção de cana-de-açúcar na Paraíba — camada de dados e futura aplicação."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "pyyaml>=6.0.2",
    "openpyxl>=3.1.5",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.1.1"]
dev = ["pytest>=8.3.0"]

[project.scripts]
canavis-pipeline = "canavis.pipeline.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canavis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
