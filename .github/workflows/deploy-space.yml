name: Deploy no Hugging Face Space

# Manual. Exige o segredo HF_TOKEN (token com escopo de escrita) e a variável
# HF_SPACE (formato usuario/nome-do-space) cadastrados no GitHub. Nenhum valor fica no código.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Montar a pasta do Space só com o que a imagem usa
        run: |
          mkdir staging
          git archive HEAD Dockerfile .dockerignore pyproject.toml uv.lock README.md \
            src apps/api apps/web data/processed | tar -x -C staging
          cp deploy/hf-space/README.md staging/README.md
      - name: Recusar arquivo acima do limite de 10 MiB do Hugging Face
        run: |
          grandes=$(find staging -type f -size +10M)
          if [ -n "$grandes" ]; then
            echo "Arquivos acima de 10 MiB, que o Space recusa:"
            echo "$grandes"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.11.3"
      - name: Enviar ao Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" && test -n "$HF_SPACE"
          uvx --from huggingface_hub==2.5.0 hf upload "$HF_SPACE" staging . \
            --repo-type space --delete "*" --commit-message "deploy: ${GITHUB_SHA}"
