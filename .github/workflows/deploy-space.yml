name: Deploy no Hugging Face Space

# Manual. Exige o segredo HF_TOKEN (token com escopo de escrita) e a variável
# HF_SPACE (formato usuario/nome-do-space) cadastrados no GitHub. Nenhum valor fica no código.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Montar a pasta do Space
        run: |
          mkdir staging
          git archive HEAD | tar -x -C staging
          cp deploy/hf-space/README.md staging/README.md
      - name: Enviar ao Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" && test -n "$HF_SPACE"
          cd staging
          git init -q -b main
          git config user.name "canavis-deploy"
          git config user.email "canavis-deploy@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
